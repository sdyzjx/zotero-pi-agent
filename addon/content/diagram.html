<!DOCTYPE html>
<html windowtype="zoteropi:diagram">
  <head>
    <meta charset="utf-8" />
    <title>Pi Agent · 图表</title>
    <style>
      :root { --bg: #fff; --bg2: #f3f4f6; --fg: #1f2328; --muted: #6b7280; --border: rgba(0,0,0,.14); --accent: #6d5bd0; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1e1f22; --bg2: #2a2b2f; --fg: #e6e6e6; --muted: #9aa0a6; --border: rgba(255,255,255,.14); --accent: #a497ff; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: message-box; font-size: 13px; }
      body { display: flex; flex-direction: column; }
      .bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--bg2); }
      .bar button { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
      .bar button:hover { border-color: var(--accent); }
      .bar .zoom { min-width: 48px; text-align: center; color: var(--muted); }
      .bar .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
      .stage { flex: 1 1 auto; overflow: auto; cursor: grab; }
      .stage.dragging { cursor: grabbing; }
      .stage img { display: block; margin: 20px auto; user-select: none; -moz-user-select: none; background: #fff; padding: 12px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="fit">适应窗口</button>
      <button id="one">100%</button>
      <button id="minus">−</button>
      <span class="zoom" id="zoom">100%</span>
      <button id="plus">+</button>
      <button id="copy">复制源码</button>
      <span class="hint">⌘/Ctrl + 滚轮缩放 · 拖动平移</span>
    </div>
    <div class="stage" id="stage"><img id="img" alt="diagram" draggable="false" /></div>
    <script src="diagram.js"></script>
  </body>
</html>

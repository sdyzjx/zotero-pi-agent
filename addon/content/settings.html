<!DOCTYPE html>
<html windowtype="zoteropi:settings">
  <head>
    <meta charset="utf-8" />
    <title>Pi Agent 设置</title>
    <style>
      :root { --bg: #fff; --bg2: #f6f7f9; --fg: #1f2328; --muted: #6b7280; --border: rgba(0,0,0,.14); --accent: #6d5bd0; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1e1f22; --bg2: #26272b; --fg: #e6e6e6; --muted: #9aa0a6; --border: rgba(255,255,255,.14); --accent: #a497ff; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: message-box; font-size: 13px; }
      .page { max-width: 760px; margin: 0 auto; padding: 20px 24px 80px; }
      header { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
      .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 18px; margin: 0; }
      .sub { color: var(--muted); font-size: 12px; }
      section { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-top: 14px; background: var(--bg); }
      h2 { font-size: 14px; margin: 0 0 8px; }
      .field { display: flex; gap: 12px; padding: 6px 0; align-items: flex-start; }
      .label { flex: 0 0 150px; padding-top: 5px; font-weight: 500; }
      .control { flex: 1 1 auto; min-width: 0; }
      .hint { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
      input:not([type=checkbox]):not([type=color]), select, textarea { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
      textarea { resize: vertical; }
      input[type=checkbox] { margin-top: 7px; }
      button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--fg); cursor: pointer; white-space: nowrap; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .6; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .row > input { flex: 1 1 200px; width: auto !important; }
      .actions { margin-top: 8px; }
      .remote { color: var(--muted); font-size: 12px; }
      .tag { padding: 1px 8px; margin: 2px; border-radius: 10px; font-size: 12px; }
      .action { display: grid; grid-template-columns: 110px 90px 1fr auto; gap: 6px; align-items: start; margin: 8px 0; }
      footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 10px 24px; border-top: 1px solid var(--border); background: var(--bg2); }
      .ok { color: #2e7d32; } .err { color: #c62828; max-width: 70%; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="settings.js"></script>
  </body>
</html>
